<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『鯊魚來了』基本版程式積木</title>
    <style>
        /* 基本重置與字體設定 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            color: #333;
        }

        /* 內容容器樣式 */
        .container {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.3s ease;
        }

        /* 標題與文字 */
        h2 {
            margin-top: 0;
            color: #1f2937;
        }
        
        .hint {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        /* 輸入框樣式 (維持 text，以便我們用 JS 控制顯示) */
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            box-sizing: border-box;
            font-size: 1.2rem; /* 字體稍微調大，讓黑點更清楚 */
            letter-spacing: 2px; /* 增加字距 */
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        /* 按鈕樣式 */
        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 錯誤訊息樣式 */
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        /* 隱藏內容區塊預設隱藏 */
        #secret-content {
            display: none;
            max-width: 500px;
        }

        /* 隱藏圖片樣式 */
        .secret-image {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 錯誤時的震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body style="flex-direction: column; padding: 2rem 0;">

    <div id="login-screen" class="container">
        <div class="lock-icon">🔒</div>
        <h2>請輸入密碼</h2>
        <p class="hint">輸入正確的密碼才能看到鯊魚來了基本版程式積木</p>
        
        <input type="text" id="password-input" placeholder="請在此輸入密碼..." autocomplete="off">
        <button onclick="checkPassword()">解鎖內容</button>
        
        <p id="error-message" class="error">❌ 密碼錯誤，請再試一次！</p>
    </div>

    <div id="secret-content" class="container">
        <div class="lock-icon">🔓</div>
        <h2>🎉 解鎖成功！</h2>
        <p>恭喜你發現了隱藏的區域！</p>
        
        <div id="dynamic-image-container"></div>
        
        <br>
        <button onclick="lockAgain()" style="background-color: #6b7280; margin-top: 1rem;">重新上鎖</button>
    </div>

    <script>
        const ENCODED_PASSWORD = "R0hFUw=="; 
        const ENCODED_IMAGE_URLS = [
            "aHR0cHM6Ly9nZW9sdjk5LWh1Yi5naXRodWIuaW8vZ2hlc2NvbS9waWMvc2hhcmswMS5wbmc=", 
            "aHR0cHM6Ly9nZW9sdjk5LWh1Yi5naXRodWIuaW8vZ2hlc2NvbS9waWMvc2hhcmswMi5wbmc="  
        ];

        // --- 新增：用來記錄真實密碼與控制計時器的變數 ---
        let realPassword = ""; 
        let hideTimer = null;
        const inputField = document.getElementById('password-input');

        // 監聽使用者的輸入事件，達成「延遲 1 秒後變黑點」的效果
        inputField.addEventListener('input', function(e) {
            let currentDisplay = this.value;

            // 判斷使用者是輸入還是刪除 (Backspace)
            if (currentDisplay.length > realPassword.length) {
                // 新增：抓出畫面上最新輸入的字，加進真實密碼中
                let newChars = currentDisplay.substring(realPassword.length);
                realPassword += newChars;
            } else {
                // 刪除：配合畫面長度，裁切真實密碼
                realPassword = realPassword.substring(0, currentDisplay.length);
            }

            // 處理畫面顯示
            if (realPassword.length > 0) {
                // 將前面全部變成黑點 '•'，只保留最後一個字元顯示明文
                let maskedText = '•'.repeat(realPassword.length - 1) + realPassword.slice(-1);
                this.value = maskedText;

                // 每次輸入就清除前一次的計時器
                clearTimeout(hideTimer);
                
                // 設定 1 秒 (1000毫秒) 後，將全部文字變成黑點
                hideTimer = setTimeout(() => {
                    this.value = '•'.repeat(realPassword.length);
                }, 1000);
            } else {
                this.value = "";
            }
        });

        // 檢查密碼的函數
        function checkPassword() {
            const errorMessage = document.getElementById('error-message');
            const loginScreen = document.getElementById('login-screen');
            const secretContent = document.getElementById('secret-content');
            const imageContainer = document.getElementById('dynamic-image-container');

            try {
                // 注意：這裡改為檢查背後記錄的 "realPassword"，而不是輸入框裡面的黑點
                const inputEncoded = btoa(encodeURIComponent(realPassword));

                if (inputEncoded === ENCODED_PASSWORD) {
                    // 密碼正確
                    loginScreen.style.display = 'none';
                    secretContent.style.display = 'block';
                    errorMessage.style.display = 'none';
                    
                    let imagesHtml = '';
                    for (let i = 0; i < ENCODED_IMAGE_URLS.length; i++) {
                        const decodedUrl = atob(ENCODED_IMAGE_URLS[i]);
                        imagesHtml += `<img src="${decodedUrl}" alt="隱藏圖片 ${i + 1}" class="secret-image" onerror="this.src='https://via.placeholder.com/600x400?text=Image+Not+Found'">`;
                    }
                    imageContainer.innerHTML = imagesHtml;
                } else {
                    // 密碼錯誤
                    showError();
                }
            } catch (e) {
                showError();
            }
        }

        // 顯示錯誤的輔助函數
        function showError() {
            const errorMessage = document.getElementById('error-message');
            
            errorMessage.style.display = 'block';
            inputField.value = '';
            realPassword = ''; // 發生錯誤時，記得也要清空真實密碼的記錄
            inputField.focus();
            
            // 重新觸發震動動畫
            errorMessage.style.animation = 'none';
            errorMessage.offsetHeight; /* 觸發 reflow */
            errorMessage.style.animation = 'shake 0.4s ease-in-out';
        }

        // 重新上鎖的函數
        function lockAgain() {
            inputField.value = '';
            realPassword = ''; // 重新上鎖時，清空真實密碼
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('secret-content').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('dynamic-image-container').innerHTML = '';
        }

        // 按下 Enter 鍵觸發解鎖
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
