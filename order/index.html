<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>團隊多場次揪團點餐系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28 font-sans">

  <!-- 頂部導覽與團主按鈕 -->
  <header class="bg-amber-600 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wide">🍱 辦公室揪團點餐</h1>
        <p id="syncStatus" class="text-xs text-amber-100">載入資料中...</p>
      </div>
      <div class="flex gap-2">
        <button onclick="loadFromCloud()" class="bg-amber-700 hover:bg-amber-800 px-2.5 py-1.5 rounded-lg text-xs font-medium">🔄 刷新</button>
        <button onclick="toggleAdminModal()" class="bg-white text-amber-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow">⚙️ 團主管理</button>
      </div>
    </div>

    <!-- 動態場次切換列 (最多顯示 6 場，由團主自由開關) -->
    <div class="max-w-md mx-auto px-4 pb-2.5">
      <div id="slotTabsContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- 餐廳資訊與狀態橫幅 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between">
      <div>
        <span class="text-xs text-slate-400 font-medium">目前選擇場次與店家</span>
        <h2 id="restaurantTitle" class="text-base font-extrabold text-slate-800 mt-0.5"></h2>
      </div>
      <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold shrink-0"></span>
    </div>

    <!-- 功能分頁切換：我要點餐 vs 結單總表(5大欄位) -->
    <div class="flex bg-slate-200 p-1 rounded-xl text-sm font-bold">
      <button id="viewBtn-order" onclick="switchView('order')" class="flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm">🛒 我要點餐</button>
      <button id="viewBtn-summary" onclick="switchView('summary')" class="flex-1 py-2 rounded-lg text-slate-600">📊 結單總表 (<span id="orderCountBadge">0</span>)</button>
    </div>

    <!-- 視圖 1：點餐區 -->
    <div id="view-order" class="space-y-4">
      <div id="closedNotice" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 text-center text-sm font-bold">
        🔒 本場次已經結單囉！請切換至上方其他場次，或點「結單總表」查看明細。
      </div>

      <div id="orderFormArea" class="space-y-4">
        <!-- 1. 點餐人 & 5. 其他備註 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">1. 點餐人姓名 / 暱稱 *</label>
            <input id="inputUserName" type="text" maxlength="25" placeholder="例如：行銷部 小明" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">5. 其他備註（選填）</label>
            <input id="inputNote" type="text" maxlength="60" placeholder="例如：需要免洗餐具、飲料袋" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
        </div>

        <!-- 2. 選擇餐點 & 3. 份數 & 4. 特殊需求 -->
        <div class="space-y-2.5" id="menuListContainer"></div>
      </div>
    </div>

    <!-- 視圖 2：結單總表與統計 -->
    <div id="view-summary" class="hidden space-y-4">
      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyLineSummary()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-3 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
          📋 複製 LINE 對帳文字
        </button>
        <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-800 text-white py-2.5 px-3 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
          📥 下載 Excel (CSV)
        </button>
      </div>

      <!-- 給餐廳看的品項合併統計 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 mb-2">📞 給店家叫餐統計（依品項＋特殊需求合併）</h3>
        <div id="dishStatsContainer" class="space-y-1.5 text-sm"></div>
      </div>

      <!-- 給團主收錢看的個人應付金額 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 mb-2">💰 本場次個人應付金額</h3>
        <div id="personStatsContainer" class="space-y-1.5 text-sm"></div>
      </div>

      <!-- 5大欄位完整明細表 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 overflow-x-auto">
        <h3 class="text-sm font-bold text-slate-800 mb-2">📋 點餐完整表單（5 大指定欄位）</h3>
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th class="py-2 pr-2">1.點餐人</th>
              <th class="py-2 pr-2">2.選擇餐點</th>
              <th class="py-2 pr-2">3.份數</th>
              <th class="py-2 pr-2">4.特殊需求</th>
              <th class="py-2">5.其他備註</th>
            </tr>
          </thead>
          <tbody id="detailTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 底部懸浮購物車送出列 -->
  <div id="bottomBar" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-lg z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <p class="text-xs text-slate-500">本場已選 <span id="cartTotalQty" class="font-bold text-amber-600">0</span> 份</p>
        <p class="text-lg font-extrabold text-slate-800">小計 $<span id="cartTotalPrice">0</span></p>
      </div>
      <button id="submitBtn" onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md">
        送出本場點餐
      </button>
    </div>
  </div>

  <!-- 團主手機管理彈窗（密碼僅送往後端驗證，前端不留存） -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-base">⚙️ 團主管理後台（最多 6 場次）</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 text-lg font-bold">✕</button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">🔒 團主驗證密碼（由後端核對）*</label>
        <input id="adminPinInput" type="password" value="" placeholder="請輸入團主密碼" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>

      <!-- 步驟 1：勾選要在前台顯示哪些場次 -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <label class="block text-xs font-bold text-slate-700">👁️ 點選要「開啟顯示」的場次（前台將同步顯示）</label>
        <div id="adminVisibilityGrid" class="grid grid-cols-2 gap-1.5"></div>
      </div>

      <!-- 步驟 2：選擇要編輯哪一個場次的詳細菜單 -->
      <div class="bg-amber-50 p-3.5 rounded-xl border border-amber-200 space-y-3">
        <div>
          <label class="block text-xs font-bold text-amber-900 mb-1">✏️ 選擇要編輯的場次</label>
          <select id="adminSlotSelector" onchange="loadAdminSlotDetail()" class="w-full border border-amber-300 rounded-lg px-2.5 py-2 text-sm font-bold bg-white text-amber-800"></select>
        </div>

        <div class="flex items-center justify-between bg-white px-3 py-2 rounded-lg border">
          <span class="text-xs font-bold text-slate-700">在前台顯示此場次</span>
          <input id="adminSlotVisible" type="checkbox" onchange="onAdminSlotVisibleToggle()" class="w-4 h-4 accent-amber-600" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">場次按鈕名稱（如：週四午餐、週四飲料）</label>
          <input id="adminDayLabel" type="text" oninput="onAdminLabelInput()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm bg-white" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">一鍵套用餐廳 / 飲料店 JSON 模版</label>
          <select id="adminTemplateSelect" onchange="onTemplateSelectChange()" class="w-full border rounded-lg px-2.5 py-2 text-sm bg-white font-medium"></select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">或貼上自訂菜單 JSON</label>
          <textarea id="adminCustomJson" rows="3" class="w-full border rounded-lg p-2 text-xs font-mono bg-white" placeholder='{"name":"自訂店家","tags":["正常","去冰"],"items":[{"name":"招牌餐","price":100}]}'></textarea>
        </div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-xs font-bold text-slate-700">本場結單狀態</span>
          <button id="adminToggleCloseBtn" type="button" onclick="toggleDayClosed()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold"></button>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button id="clearOrdersBtn" onclick="clearCurrentDayOrders()" class="flex-1 bg-red-100 text-red-700 py-2.5 rounded-xl text-xs font-bold">🗑️ 清空此場訂單</button>
        <button id="saveConfigBtn" onclick="saveAdminConfig()" class="flex-1 bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold shadow">💾 儲存全部設定</button>
      </div>
    </div>
  </div>

  <script>
    // ====================================================
    // 已填入您的 Google Apps Script 部署網址
    // ====================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz9dpaum4R4wgPoLK2gywoKjBLsO8VR3SGDD--ocE8scIB0S12fTUMgGT9XEYokIktT/exec";

    const SLOT_KEYS = ["slot1", "slot2", "slot3", "slot4", "slot5", "slot6"];

    // 防範前端 XSS 跨站腳本攻擊轉義函式
    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 內建正餐與飲料 JSON 模版庫
    const RESTAURANT_TEMPLATES = {
      thai: {
        name: "🐘 泰美味泰式料理",
        tags: ["正常", "不辣", "微辣", "小辣", "中辣", "大辣", "飯少", "不加香菜"],
        items: [
          { name: "泰式打拋豬肉飯", price: 130, category: "主餐" },
          { name: "綠咖哩椰汁雞飯", price: 140, category: "主餐" },
          { name: "泰式酸辣海鮮河粉", price: 150, category: "主餐" },
          { name: "泰式椒麻雞腿飯", price: 145, category: "主餐" },
          { name: "月亮蝦餅 (單點)", price: 180, category: "單點" },
          { name: "涼拌青木瓜絲", price: 100, category: "單點" }
        ]
      },
      bento: {
        name: "🍱 阿霞人氣手作便當",
        tags: ["正常", "飯少", "加飯(+$10)", "不要酸菜", "加辣菜脯", "去滷汁"],
        items: [
          { name: "招牌厚切排骨飯", price: 115, category: "便當" },
          { name: "脆皮炸雞腿便當", price: 125, category: "便當" },
          { name: "挪威炙燒鯖魚飯", price: 120, category: "便當" },
          { name: "古早味滷雞腿飯", price: 115, category: "便當" },
          { name: "蒜泥白肉便當", price: 110, category: "便當" },
          { name: "養生味噌湯", price: 25, category: "湯品" }
        ]
      },
      drink: {
        name: "🧋 幸福堂手搖飲專賣",
        tags: ["無糖去冰", "無糖微冰", "微糖微冰", "微糖去冰", "半糖少冰", "正常冰糖", "加珍珠(+$10)"],
        items: [
          { name: "手標泰式奶茶", price: 60, category: "奶茶" },
          { name: "黑糖珍珠鮮奶", price: 65, category: "鮮奶" },
          { name: "四季春青茶", price: 35, category: "原茶" },
          { name: "錫蘭紅玉拿鐵", price: 60, category: "鮮奶茶" },
          { name: "滿杯紅柚綠茶", price: 65, category: "果茶" }
        ]
      },
      cafe: {
        name: "☕ 職人咖啡下午茶",
        tags: ["冰-無糖", "冰-微糖", "冰-少冰", "熱-無糖", "熱-微糖", "換燕麥奶(+$15)"],
        items: [
          { name: "美式黑咖啡 (大)", price: 55, category: "咖啡" },
          { name: "經典醇厚拿鐵 (大)", price: 75, category: "咖啡" },
          { name: "海鹽焦糖瑪奇朵", price: 85, category: "特調" },
          { name: "靜岡抹茶拿鐵", price: 80, category: "歐蕾" },
          { name: "比利時烈日鬆餅", price: 60, category: "點心" }
        ]
      }
    };

    function getDefaultConfig() {
      return {
        slot1: { visible: true,  label: "週四午餐", templateKey: "thai",  closed: false, customMenu: null },
        slot2: { visible: true,  label: "週四飲料", templateKey: "drink", closed: false, customMenu: null },
        slot3: { visible: true,  label: "週五午餐", templateKey: "bento", closed: false, customMenu: null },
        slot4: { visible: true,  label: "週五飲料", templateKey: "cafe",  closed: false, customMenu: null },
        slot5: { visible: false, label: "備用場次5", templateKey: "thai",  closed: false, customMenu: null },
        slot6: { visible: false, label: "備用場次6", templateKey: "drink", closed: false, customMenu: null }
      };
    }

    let state = {
      currentDay: "slot1",
      currentView: "order",
      editingSlot: "slot1",
      config: getDefaultConfig(),
      orders: [],
      cart: {}
    };

    const isCloudConfigured = () => GAS_URL && GAS_URL.startsWith("https://script.google.com/");

    window.onload = () => {
      initTemplateSelect();
      renderAll();
      loadFromCloud();
    };

    function initTemplateSelect() {
      const sel = document.getElementById("adminTemplateSelect");
      sel.innerHTML = Object.keys(RESTAURANT_TEMPLATES).map(k =>
        `<option value="${k}">${escapeHTML(RESTAURANT_TEMPLATES[k].name)}</option>`
      ).join("") + `<option value="custom">✨ 使用下方自訂 JSON 菜單</option>`;
    }

    function ensureSixSlotsConfig(conf) {
      const def = getDefaultConfig();
      SLOT_KEYS.forEach(k => {
        if (!conf[k]) conf[k] = def[k];
      });
      return conf;
    }

    async function loadFromCloud() {
      const statusEl = document.getElementById("syncStatus");
      if (!isCloudConfigured()) {
        statusEl.textContent = "💡 本機預覽模式";
        renderAll();
        return;
      }

      try {
        statusEl.textContent = "🔄 雲端試算表同步中...";
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status === "ok") {
          state.config = ensureSixSlotsConfig(data.config);
          state.orders = data.orders;
          statusEl.textContent = "✅ 已與 Google 試算表即時同步";
          ensureValidCurrentSlot();
          renderAll();
        }
      } catch (e) {
        statusEl.textContent = "⚠️ 雲端連線失敗，請檢查網路或 GAS 部署狀態";
      }
    }

    function ensureValidCurrentSlot() {
      const visibleSlots = SLOT_KEYS.filter(k => state.config[k] && state.config[k].visible);
      if (visibleSlots.length === 0) {
        state.config.slot1.visible = true;
        state.currentDay = "slot1";
      } else if (!visibleSlots.includes(state.currentDay)) {
        state.currentDay = visibleSlots[0];
      }
    }

    function getActiveMenu(slotKey) {
      const slotConf = state.config[slotKey];
      if (slotConf && slotConf.templateKey === "custom" && slotConf.customMenu) {
        return slotConf.customMenu;
      }
      return RESTAURANT_TEMPLATES[slotConf?.templateKey] || RESTAURANT_TEMPLATES.thai;
    }

    function switchDay(slotKey) {
      state.currentDay = slotKey;
      state.cart = {};
      renderAll();
    }

    function switchView(view) {
      state.currentView = view;
      renderAll();
    }

    function renderAll() {
      ensureValidCurrentSlot();
      const dayConf = state.config[state.currentDay];
      const menu = getActiveMenu(state.currentDay);

      // 動態渲染頂部開啟的場次按鈕 (1~6 個)
      const visibleSlots = SLOT_KEYS.filter(k => state.config[k] && state.config[k].visible);
      const tabsContainer = document.getElementById("slotTabsContainer");
      tabsContainer.innerHTML = visibleSlots.map(k => {
        const c = state.config[k];
        const lockIcon = c.closed ? "🔒" : "🟢";
        const isCurrent = state.currentDay === k;
        const btnClass = isCurrent
          ? "py-2 px-2 rounded-xl text-xs font-extrabold transition shadow bg-white text-amber-700 truncate"
          : "py-2 px-2 rounded-xl text-xs font-bold transition bg-amber-700/60 text-amber-100 hover:bg-amber-700 truncate";
        return `<button onclick="switchDay('${k}')" class="${btnClass}">${lockIcon} ${escapeHTML(c.label)}</button>`;
      }).join("");

      // 餐廳標題與狀態
      document.getElementById("restaurantTitle").textContent = `${dayConf.label}｜${menu.name}`;
      const badge = document.getElementById("statusBadge");
      if (dayConf.closed) {
        badge.textContent = "🔒 已結單";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 shrink-0";
      } else {
        badge.textContent = "🟢 開放中";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 shrink-0";
      }

      // 分頁按鈕與訂單數
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      document.getElementById("orderCountBadge").textContent = dayOrders.length;

      document.getElementById("viewBtn-order").className = state.currentView === "order"
        ? "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm"
        : "flex-1 py-2 rounded-lg text-slate-600";
      document.getElementById("viewBtn-summary").className = state.currentView === "summary"
        ? "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm"
        : "flex-1 py-2 rounded-lg text-slate-600";

      document.getElementById("view-order").classList.toggle("hidden", state.currentView !== "order");
      document.getElementById("view-summary").classList.toggle("hidden", state.currentView !== "summary");

      document.getElementById("closedNotice").classList.toggle("hidden", !dayConf.closed);
      document.getElementById("orderFormArea").classList.toggle("hidden", dayConf.closed);
      document.getElementById("bottomBar").classList.toggle("hidden", state.currentView !== "order" || dayConf.closed);

      renderMenuCards(menu);
      renderCartBar(menu);
      renderSummary(dayOrders);
    }

    function renderMenuCards(menu) {
      const container = document.getElementById("menuListContainer");
      const defaultTag = (menu.tags && menu.tags[0]) ? menu.tags[0] : "正常";
      container.innerHTML = menu.items.map((item, idx) => {
        const cartItem = state.cart[idx] || { qty: 0, special: defaultTag };
        const activeClass = cartItem.qty > 0 ? "border-amber-500 ring-2 ring-amber-200 bg-amber-50/30" : "border-slate-200 bg-white";

        const tagButtons = (menu.tags || ["正常"]).map(tag => {
          const isSelected = cartItem.special === tag;
          const safeTag = escapeHTML(tag);
          return `<button type="button" onclick="selectSpecial(${idx}, '${safeTag}')" class="px-2.5 py-1 rounded-full text-xs font-bold border ${isSelected ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-100 text-slate-600 border-slate-200'}">${safeTag}</button>`;
        }).join("");

        return `
          <div class="rounded-2xl p-4 shadow-sm border transition ${activeClass}">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold">${escapeHTML(item.category || '品項')}</span>
                <h4 class="text-base font-extrabold text-slate-800 mt-1">${escapeHTML(item.name)}</h4>
                <p class="text-sm font-bold text-amber-600">$${Number(item.price) || 0}</p>
              </div>
              <div class="flex items-center gap-3">
                <button type="button" onclick="changeQty(${idx}, -1)" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold text-lg flex items-center justify-center">－</button>
                <span class="w-5 text-center font-extrabold text-base">${cartItem.qty}</span>
                <button type="button" onclick="changeQty(${idx}, 1)" class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold text-lg flex items-center justify-center shadow">＋</button>
              </div>
            </div>

            ${cartItem.qty > 0 ? `
              <div class="mt-3 pt-3 border-t border-slate-200 space-y-2">
                <label class="block text-xs font-bold text-slate-600">4. 餐點特殊需求（點擊標籤或自行輸入）</label>
                <div class="flex flex-wrap gap-1.5">${tagButtons}</div>
                <input type="text" maxlength="40" value="${escapeHTML(cartItem.special)}" oninput="updateCustomSpecial(${idx}, this.value)" placeholder="可自行輸入客製需求..." class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white" />
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function changeQty(idx, delta) {
      const menu = getActiveMenu(state.currentDay);
      const defaultTag = (menu.tags && menu.tags[0]) ? menu.tags[0] : "正常";
      const cur = state.cart[idx] || { qty: 0, special: defaultTag };
      const nextQty = Math.max(0, cur.qty + delta);
      if (nextQty === 0) {
        delete state.cart[idx];
      } else {
        state.cart[idx] = { ...cur, qty: nextQty };
      }
      renderAll();
    }

    function selectSpecial(idx, tag) {
      if (!state.cart[idx]) return;
      state.cart[idx].special = tag;
      renderAll();
    }

    function updateCustomSpecial(idx, val) {
      if (!state.cart[idx]) return;
      state.cart[idx].special = val;
    }

    function renderCartBar(menu) {
      let totalQty = 0;
      let totalPrice = 0;
      Object.keys(state.cart).forEach(idx => {
        const item = menu.items[idx];
        const c = state.cart[idx];
        if (item && c.qty > 0) {
          totalQty += c.qty;
          totalPrice += item.price * c.qty;
        }
      });
      document.getElementById("cartTotalQty").textContent = totalQty;
      document.getElementById("cartTotalPrice").textContent = totalPrice;
    }

    async function submitOrder() {
      const userName = document.getElementById("inputUserName").value.trim();
      const note = document.getElementById("inputNote").value.trim();
      const menu = getActiveMenu(state.currentDay);

      if (!userName) {
        alert("請填寫「1. 點餐人姓名 / 暱稱」！");
        return;
      }

      const selectedItems = [];
      Object.keys(state.cart).forEach(idx => {
        const c = state.cart[idx];
        const m = menu.items[idx];
        if (c.qty > 0 && m) {
          selectedItems.push({
            mealName: m.name,
            price: m.price,
            qty: c.qty,
            special: c.special || "正常"
          });
        }
      });

      if (selectedItems.length === 0) {
        alert("請至少選擇一道品項（點擊 ＋ 增加份數）！");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "送出中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "addOrders",
            day: state.currentDay,
            userName,
            note,
            items: selectedItems
          })
        });
        const data = await res.json();
        if (data.status !== "ok") {
          alert(data.message || "送出失敗");
          btn.disabled = false;
          btn.textContent = "送出本場點餐";
          return;
        }
        await loadFromCloud();
        state.cart = {};
        document.getElementById("inputNote").value = "";
        alert(`🎉 ${userName} 在【${state.config[state.currentDay].label}】點餐成功！`);
        switchView("summary");
      } catch (e) {
        alert("連線異常，請稍後再試");
      } finally {
        btn.disabled = false;
        btn.textContent = "送出本場點餐";
      }
    }

    function renderSummary(dayOrders) {
      const dishMap = {};
      dayOrders.forEach(o => {
        const key = `${o.mealName}（${o.special || '正常'}）`;
        dishMap[key] = (dishMap[key] || 0) + Number(o.qty);
      });
      const dishContainer = document.getElementById("dishStatsContainer");
      const dishKeys = Object.keys(dishMap);
      dishContainer.innerHTML = dishKeys.length === 0
        ? `<p class="text-xs text-slate-400">本場次目前尚無點餐紀錄</p>`
        : dishKeys.map(k => `
            <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg">
              <span class="font-medium text-slate-700">${escapeHTML(k)}</span>
              <span class="font-extrabold text-amber-700">${dishMap[k]} 份</span>
            </div>
          `).join("");

      const personMap = {};
      let grandTotal = 0;
      dayOrders.forEach(o => {
        if (!personMap[o.userName]) personMap[o.userName] = { total: 0, items: [] };
        const sub = Number(o.price) * Number(o.qty);
        personMap[o.userName].total += sub;
        personMap[o.userName].items.push(`${o.mealName}x${o.qty}`);
        grandTotal += sub;
      });
      const personContainer = document.getElementById("personStatsContainer");
      const personKeys = Object.keys(personMap);
      personContainer.innerHTML = personKeys.length === 0
        ? `<p class="text-xs text-slate-400">本場次目前尚無點餐紀錄</p>`
        : personKeys.map(p => `
            <div class="flex justify-between items-center border-b border-slate-100 py-1.5">
              <div>
                <span class="font-bold text-slate-800">${escapeHTML(p)}</span>
                <span class="text-xs text-slate-400 block">${escapeHTML(personMap[p].items.join("、"))}</span>
              </div>
              <span class="font-extrabold text-emerald-700">$${personMap[p].total}</span>
            </div>
          `).join("") + `
            <div class="flex justify-between items-center pt-2 font-extrabold text-base text-slate-900">
              <span>本場次總金額</span>
              <span class="text-amber-600">$${grandTotal}</span>
            </div>
          `;

      const tbody = document.getElementById("detailTableBody");
      tbody.innerHTML = dayOrders.map(o => `
        <tr>
          <td class="py-2 pr-2 font-bold text-slate-800">${escapeHTML(o.userName)}</td>
          <td class="py-2 pr-2">${escapeHTML(o.mealName)} <span class="text-slate-400">($${Number(o.price) || 0})</span></td>
          <td class="py-2 pr-2 font-bold">${Number(o.qty) || 0}</td>
          <td class="py-2 pr-2 text-amber-700">${escapeHTML(o.special || '正常')}</td>
          <td class="py-2 text-slate-500">${escapeHTML(o.note || '-')}</td>
        </tr>
      `).join("");
    }

    function copyLineSummary() {
      const dayConf = state.config[state.currentDay];
      const menu = getActiveMenu(state.currentDay);
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      if (dayOrders.length === 0) return alert("本場次目前沒有訂單可複製");

      let lines = [`📣 【${dayConf.label}｜${menu.name}】結單明細\n`];
      const personMap = {};
      let grandTotal = 0;

      dayOrders.forEach(o => {
        if (!personMap[o.userName]) personMap[o.userName] = { total: 0, list: [] };
        const sub = Number(o.price) * Number(o.qty);
        personMap[o.userName].total += sub;
        personMap[o.userName].list.push(`${o.mealName} x${o.qty} (${o.special})`);
        grandTotal += sub;
      });

      lines.push("💰 【個人收款明細】");
      Object.keys(personMap).forEach(p => {
        lines.push(`• ${p}：$${personMap[p].total}｜${personMap[p].list.join(" + ")}`);
      });
      lines.push(`\n本場總計：$${grandTotal}`);

      navigator.clipboard.writeText(lines.join("\n"));
      alert("✅ 已複製 LINE 對帳文字！");
    }

    function exportCSV() {
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      if (dayOrders.length === 0) return alert("目前沒有資料可匯出");
      let csv = "\uFEFF場次,1.點餐人,2.選擇餐點,單價,3.餐點份數,4.餐點特殊需求,5.其他備註\n";
      const label = state.config[state.currentDay].label;
      dayOrders.forEach(o => {
        csv += `"${label}","${o.userName}","${o.mealName}",${o.price},${o.qty},"${o.special || ''}","${o.note || ''}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${label}_點餐總表.csv`;
      link.click();
    }

    // ==========================================
    // 團主 6 場次管理後台邏輯（後端密碼驗證版）
    // ==========================================
    function toggleAdminModal() {
      const modal = document.getElementById("adminModal");
      const isHidden = modal.classList.contains("hidden");
      if (isHidden) {
        state.editingSlot = state.currentDay;
        renderAdminSlotSelector();
        renderAdminVisibilityGrid();
        loadAdminSlotDetail();
      }
      modal.classList.toggle("hidden");
    }

    function renderAdminVisibilityGrid() {
      const grid = document.getElementById("adminVisibilityGrid");
      grid.innerHTML = SLOT_KEYS.map((k, idx) => {
        const c = state.config[k];
        const active = c.visible;
        return `
          <button type="button" onclick="quickToggleVisible('${k}')" class="flex items-center justify-between px-2.5 py-1.5 rounded-lg border text-xs font-bold ${active ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-slate-400 border-slate-200'}">
            <span class="truncate">${idx + 1}. ${escapeHTML(c.label)}</span>
            <span>${active ? '👁️顯示' : '🙈隱藏'}</span>
          </button>
        `;
      }).join("");
    }

    function quickToggleVisible(slotKey) {
      saveCurrentEditingSlotToMemory();
      state.config[slotKey].visible = !state.config[slotKey].visible;
      renderAdminVisibilityGrid();
      renderAdminSlotSelector();
      if (state.editingSlot === slotKey) {
        document.getElementById("adminSlotVisible").checked = state.config[slotKey].visible;
      }
    }

    function renderAdminSlotSelector() {
      const sel = document.getElementById("adminSlotSelector");
      sel.innerHTML = SLOT_KEYS.map((k, idx) => {
        const c = state.config[k];
        const visTag = c.visible ? "👁️顯示中" : "🙈已隱藏";
        return `<option value="${k}" ${state.editingSlot === k ? 'selected' : ''}>場次 ${idx + 1}：${escapeHTML(c.label)} (${visTag})</option>`;
      }).join("");
    }

    function saveCurrentEditingSlotToMemory() {
      const k = state.editingSlot;
      if (!k || !state.config[k]) return;
      const slotConf = state.config[k];
      const labelEl = document.getElementById("adminDayLabel");
      if (!labelEl) return;

      slotConf.visible = document.getElementById("adminSlotVisible").checked;
      slotConf.label = labelEl.value.trim() || slotConf.label;
      slotConf.templateKey = document.getElementById("adminTemplateSelect").value;
      slotConf.closed = document.getElementById("adminToggleCloseBtn").dataset.closed === "true";

      const rawJson = document.getElementById("adminCustomJson").value.trim();
      if (slotConf.templateKey === "custom" && rawJson) {
        try {
          slotConf.customMenu = JSON.parse(rawJson);
        } catch (e) {}
      }
    }

    function loadAdminSlotDetail() {
      const sel = document.getElementById("adminSlotSelector");
      if (sel.value !== state.editingSlot) {
        saveCurrentEditingSlotToMemory();
        state.editingSlot = sel.value;
      }
      const slotConf = state.config[state.editingSlot];
      document.getElementById("adminSlotVisible").checked = !!slotConf.visible;
      document.getElementById("adminDayLabel").value = slotConf.label;
      document.getElementById("adminTemplateSelect").value = slotConf.templateKey;
      document.getElementById("adminCustomJson").value = slotConf.customMenu
        ? JSON.stringify(slotConf.customMenu, null, 2)
        : JSON.stringify(RESTAURANT_TEMPLATES[slotConf.templateKey] || RESTAURANT_TEMPLATES.thai, null, 2);
      updateAdminCloseBtnUI(slotConf.closed);
    }

    function onAdminSlotVisibleToggle() {
      state.config[state.editingSlot].visible = document.getElementById("adminSlotVisible").checked;
      renderAdminVisibilityGrid();
      renderAdminSlotSelector();
    }

    function onAdminLabelInput() {
      state.config[state.editingSlot].label = document.getElementById("adminDayLabel").value.trim() || "未命名場次";
      renderAdminVisibilityGrid();
      renderAdminSlotSelector();
    }

    function onTemplateSelectChange() {
      const val = document.getElementById("adminTemplateSelect").value;
      if (val !== "custom" && RESTAURANT_TEMPLATES[val]) {
        document.getElementById("adminCustomJson").value = JSON.stringify(RESTAURANT_TEMPLATES[val], null, 2);
      }
    }

    function updateAdminCloseBtnUI(closed) {
      const btn = document.getElementById("adminToggleCloseBtn");
      btn.dataset.closed = closed ? "true" : "false";
      if (closed) {
        btn.textContent = "🔒 已結單（點此重新開放）";
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white";
      } else {
        btn.textContent = "🟢 開放中（點此一鍵結單）";
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white";
      }
    }

    function toggleDayClosed() {
      const btn = document.getElementById("adminToggleCloseBtn");
      const next = btn.dataset.closed !== "true";
      updateAdminCloseBtnUI(next);
    }

    async function saveAdminConfig() {
      const pin = document.getElementById("adminPinInput").value.trim();
      if (!pin) return alert("請先輸入團主驗證密碼！");

      saveCurrentEditingSlotToMemory();

      const rawJson = document.getElementById("adminCustomJson").value.trim();
      if (state.config[state.editingSlot].templateKey === "custom" && rawJson) {
        try {
          state.config[state.editingSlot].customMenu = JSON.parse(rawJson);
        } catch (e) {
          return alert("自訂 JSON 格式有誤，請檢查括號或引號！");
        }
      }

      const btn = document.getElementById("saveConfigBtn");
      btn.disabled = true;
      btn.textContent = "驗證儲存中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveConfig", pin: pin, config: state.config })
        });
        const data = await res.json();
        if (data.status !== "ok") {
          alert(data.message || "儲存失敗");
          await loadFromCloud();
          return;
        }
        await loadFromCloud();
        toggleAdminModal();
      } catch (e) {
        alert("連線失敗，請檢查網路");
      } finally {
        btn.disabled = false;
        btn.textContent = "💾 儲存全部設定";
      }
    }

    async function clearCurrentDayOrders() {
      const pin = document.getElementById("adminPinInput").value.trim();
      if (!pin) return alert("請先輸入團主驗證密碼！");

      const targetSlot = state.editingSlot;
      const label = state.config[targetSlot].label;
      if (!confirm(`確定要清空【${label}】的所有點餐紀錄嗎？`)) return;

      const btn = document.getElementById("clearOrdersBtn");
      btn.disabled = true;
      btn.textContent = "清空中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "clearDayOrders", pin: pin, day: targetSlot })
        });
        const data = await res.json();
        if (data.status !== "ok") {
          alert(data.message || "清空失敗");
          return;
        }
        await loadFromCloud();
        toggleAdminModal();
      } catch (e) {
        alert("連線失敗，請檢查網路");
      } finally {
        btn.disabled = false;
        btn.textContent = "🗑️ 清空此場訂單";
      }
    }
  </script>
</body>
</html>
