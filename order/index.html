<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>團隊雙日揪團點餐系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28 font-sans">

  <!-- 頂部導覽與團主按鈕 -->
  <header class="bg-amber-600 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-wide">🍱 辦公室揪團點餐</h1>
        <p id="syncStatus" class="text-xs text-amber-100">載入資料中...</p>
      </div>
      <div class="flex gap-2">
        <button onclick="loadFromCloud()" class="bg-amber-700 hover:bg-amber-800 px-2.5 py-1.5 rounded-lg text-xs font-medium">🔄 刷新</button>
        <button onclick="toggleAdminModal()" class="bg-white text-amber-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow">⚙️ 團主管理</button>
      </div>
    </div>

    <!-- 雙日切換 Tab (週四 / 週五互不干擾) -->
    <div class="max-w-md mx-auto px-4 pb-2 grid grid-cols-2 gap-2">
      <button id="tab-day1" onclick="switchDay('day1')" class="py-2 rounded-xl text-sm font-bold transition shadow-sm bg-white text-amber-700"></button>
      <button id="tab-day2" onclick="switchDay('day2')" class="py-2 rounded-xl text-sm font-bold transition bg-amber-700/60 text-amber-100"></button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- 餐廳資訊與狀態橫幅 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between">
      <div>
        <span class="text-xs text-slate-400 font-medium">本日餐廳</span>
        <h2 id="restaurantTitle" class="text-lg font-extrabold text-slate-800"></h2>
      </div>
      <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold"></span>
    </div>

    <!-- 功能分頁切換：我要點餐 vs 結單總表(5大欄位) -->
    <div class="flex bg-slate-200 p-1 rounded-xl text-sm font-bold">
      <button id="viewBtn-order" onclick="switchView('order')" class="flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm">🛒 我要點餐</button>
      <button id="viewBtn-summary" onclick="switchView('summary')" class="flex-1 py-2 rounded-lg text-slate-600">📊 結單總表 (<span id="orderCountBadge">0</span>)</button>
    </div>

    <!-- 視圖 1：點餐區 -->
    <div id="view-order" class="space-y-4">
      <div id="closedNotice" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 text-center text-sm font-bold">
        🔒 本場次已經結單囉！請切換至「結單總表」查看明細。
      </div>

      <div id="orderFormArea" class="space-y-4">
        <!-- 1. 點餐人 & 5. 其他備註 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">1. 點餐人姓名 / 暱稱 *</label>
            <input id="inputUserName" type="text" placeholder="例如：行銷部 小明" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">5. 其他備註（選填）</label>
            <input id="inputNote" type="text" placeholder="例如：需要免洗餐具、12:30後取餐" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
          </div>
        </div>

        <!-- 2. 選擇餐點 & 3. 份數 & 4. 特殊需求 -->
        <div class="space-y-2.5" id="menuListContainer"></div>
      </div>
    </div>

    <!-- 視圖 2：結單總表與統計 -->
    <div id="view-summary" class="hidden space-y-4">
      <!-- 一鍵複製 LINE 與匯出 CSV -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyLineSummary()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-3 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
          📋 複製 LINE 對帳文字
        </button>
        <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-800 text-white py-2.5 px-3 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
          📥 下載 Excel (CSV)
        </button>
      </div>

      <!-- 給餐廳看的品項合併統計 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 mb-2">📞 給餐廳叫餐統計（依品項＋特殊需求合併）</h3>
        <div id="dishStatsContainer" class="space-y-1.5 text-sm"></div>
      </div>

      <!-- 給團主收錢看的個人應付金額 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 mb-2">💰 個人應付金額統計</h3>
        <div id="personStatsContainer" class="space-y-1.5 text-sm"></div>
      </div>

      <!-- 5大欄位完整明細表 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 overflow-x-auto">
        <h3 class="text-sm font-bold text-slate-800 mb-2">📋 點餐完整表單（5 大指定欄位）</h3>
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th class="py-2 pr-2">1.點餐人</th>
              <th class="py-2 pr-2">2.選擇餐點</th>
              <th class="py-2 pr-2">3.份數</th>
              <th class="py-2 pr-2">4.特殊需求</th>
              <th class="py-2">5.其他備註</th>
            </tr>
          </thead>
          <tbody id="detailTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 底部懸浮購物車送出列 -->
  <div id="bottomBar" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-lg z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <p class="text-xs text-slate-500">已選 <span id="cartTotalQty" class="font-bold text-amber-600">0</span> 份餐點</p>
        <p class="text-lg font-extrabold text-slate-800">總計 $<span id="cartTotalPrice">0</span></p>
      </div>
      <button id="submitBtn" onclick="submitOrder()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md">
        送出點餐
      </button>
    </div>
  </div>

  <!-- 團主手機管理彈窗 -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-base">⚙️ 團主手機管理後台</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 text-lg font-bold">✕</button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">團主密碼（預設 8888）</label>
        <input id="adminPinInput" type="password" value="8888" class="w-full border rounded-xl px-3 py-2 text-sm" />
      </div>

      <!-- 當前場次設定 -->
      <div class="bg-amber-50 p-3.5 rounded-xl border border-amber-200 space-y-3">
        <p class="text-xs font-bold text-amber-800">目前管理場次：<span id="adminCurrentDayTitle"></span></p>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">場次顯示名稱</label>
          <input id="adminDayLabel" type="text" class="w-full border rounded-lg px-2.5 py-1.5 text-sm bg-white" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">一鍵切換餐廳 JSON 模版</label>
          <select id="adminTemplateSelect" onchange="onTemplateSelectChange()" class="w-full border rounded-lg px-2.5 py-2 text-sm bg-white font-medium"></select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">或貼上自訂菜單 JSON（AI 辨識照片後貼此）</label>
          <textarea id="adminCustomJson" rows="4" class="w-full border rounded-lg p-2 text-xs font-mono bg-white" placeholder='{"name":"自訂餐廳","tags":["不辣","小辣"],"items":[{"name":"招牌飯","price":120}]}'></textarea>
        </div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-xs font-bold text-slate-700">結單鎖定狀態</span>
          <button id="adminToggleCloseBtn" onclick="toggleDayClosed()" class="px-4 py-1.5 rounded-lg text-xs font-bold"></button>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="clearCurrentDayOrders()" class="flex-1 bg-red-100 text-red-700 py-2.5 rounded-xl text-xs font-bold">🗑️ 清空本場訂單</button>
        <button onclick="saveAdminConfig()" class="flex-1 bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold shadow">💾 儲存並同步</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 請將下方網址替換為您的 Google Apps Script 網址
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzIWkpjYl7qARbcyn-1tDcnk-W2_B_UaIAlGW0pKNqpFK_Hcb57XEBJH4sa7ZxhVI4zJA/exec";

    // 內建餐廳 JSON 模版庫（可隨時擴充）
    const RESTAURANT_TEMPLATES = {
      thai: {
        name: "🐘 泰美味泰式料理",
        tags: ["正常", "不辣", "微辣", "小辣", "中辣", "大辣", "飯少", "不加香菜", "去冰"],
        items: [
          { name: "泰式打拋豬肉飯", price: 130, category: "主餐" },
          { name: "綠咖哩椰汁雞飯", price: 140, category: "主餐" },
          { name: "泰式酸辣海鮮河粉", price: 150, category: "主餐" },
          { name: "泰式椒麻雞腿飯", price: 145, category: "主餐" },
          { name: "月亮蝦餅 (單點)", price: 180, category: "單點小菜" },
          { name: "涼拌青木瓜絲", price: 100, category: "單點小菜" },
          { name: "手標泰式奶茶", price: 60, category: "飲料" },
          { name: "泰式檸檬綠茶", price: 50, category: "飲料" }
        ]
      },
      bento: {
        name: "🍱 阿霞人氣手作便當",
        tags: ["正常", "飯少", "加飯(+$10)", "不要酸菜", "加辣菜脯", "去滷汁"],
        items: [
          { name: "招牌厚切排骨飯", price: 115, category: "主餐" },
          { name: "脆皮炸雞腿便當", price: 125, category: "主餐" },
          { name: "挪威炙燒鯖魚飯", price: 120, category: "主餐" },
          { name: "古早味滷雞腿飯", price: 115, category: "主餐" },
          { name: "蒜泥白肉便當", price: 110, category: "主餐" },
          { name: "單點炸排骨", price: 70, category: "單點" },
          { name: "養生味噌湯", price: 25, category: "湯品" }
        ]
      },
      drink: {
        name: "🧋 幸福堂下午茶手搖飲",
        tags: ["無糖去冰", "微糖微冰", "半糖少冰", "無糖常溫", "加珍珠(+$10)", "加椰果(+$10)"],
        items: [
          { name: "黑糖珍珠鮮奶", price: 65, category: "鮮奶系列" },
          { name: "四季春青茶", price: 35, category: "原茶" },
          { name: "錫蘭紅玉拿鐵", price: 60, category: "鮮奶茶" },
          { name: "滿杯紅柚綠茶", price: 65, category: "果茶" },
          { name: "芋頭鮮奶西米露", price: 70, category: "特調" }
        ]
      }
    };

    let state = {
      currentDay: "day1",
      currentView: "order",
      config: {
        pin: "8888",
        day1: { label: "週四場", templateKey: "thai", closed: false, customMenu: null },
        day2: { label: "週五場", templateKey: "bento", closed: false, customMenu: null }
      },
      orders: [],
      cart: {} // key: itemIndex, value: { qty, special }
    };

    const isCloudConfigured = () => GAS_URL && GAS_URL.startsWith("https://script.google.com/");

    window.onload = () => {
      initTemplateSelect();
      loadFromCloud();
    };

    function initTemplateSelect() {
      const sel = document.getElementById("adminTemplateSelect");
      sel.innerHTML = Object.keys(RESTAURANT_TEMPLATES).map(k =>
        `<option value="${k}">${RESTAURANT_TEMPLATES[k].name}</option>`
      ).join("") + `<option value="custom">✨ 使用下方自訂 JSON 菜單</option>`;
    }

    async function loadFromCloud() {
      const statusEl = document.getElementById("syncStatus");
      if (!isCloudConfigured()) {
        statusEl.textContent = "💡 本機預覽模式（綁定試算表後即可多人同步）";
        const saved = localStorage.getItem("local_order_state");
        if (saved) {
          const parsed = JSON.parse(saved);
          state.config = parsed.config || state.config;
          state.orders = parsed.orders || [];
        } else {
          // 預設塞入兩筆範例方便預覽
          state.orders = [
            { id: "1", day: "day1", userName: "王小美", mealName: "泰式打拋豬肉飯", price: 130, qty: 1, special: "小辣, 飯少", note: "自備環保筷" },
            { id: "2", day: "day1", userName: "王小美", mealName: "手標泰式奶茶", price: 60, qty: 1, special: "去冰", note: "自備環保筷" },
            { id: "3", day: "day2", userName: "陳大文", mealName: "脆皮炸雞腿便當", price: 125, qty: 1, special: "加辣菜脯", note: "" }
          ];
        }
        renderAll();
        return;
      }

      try {
        statusEl.textContent = "🔄 雲端試算表同步中...";
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status === "ok") {
          state.config = data.config;
          state.orders = data.orders;
          statusEl.textContent = "✅ 已與 Google 試算表即時同步";
          renderAll();
        }
      } catch (e) {
        statusEl.textContent = "⚠️ 雲端連線失敗，請檢查 GAS_URL 設定";
      }
    }

    function saveLocalFallback() {
      localStorage.setItem("local_order_state", JSON.stringify({
        config: state.config,
        orders: state.orders
      }));
    }

    function getActiveMenu(dayKey) {
      const dayConf = state.config[dayKey];
      if (dayConf.templateKey === "custom" && dayConf.customMenu) {
        return dayConf.customMenu;
      }
      return RESTAURANT_TEMPLATES[dayConf.templateKey] || RESTAURANT_TEMPLATES.thai;
    }

    function switchDay(dayKey) {
      state.currentDay = dayKey;
      state.cart = {};
      renderAll();
    }

    function switchView(view) {
      state.currentView = view;
      renderAll();
    }

    function renderAll() {
      const dayConf = state.config[state.currentDay];
      const menu = getActiveMenu(state.currentDay);

      // 頂部雙日按鈕
      ["day1", "day2"].forEach(d => {
        const btn = document.getElementById(`tab-${d}`);
        const c = state.config[d];
        const m = getActiveMenu(d);
        const lockIcon = c.closed ? "🔒" : "🟢";
        btn.textContent = `${lockIcon} ${c.label} (${m.name.slice(0, 6)})`;
        btn.className = state.currentDay === d
          ? "py-2 rounded-xl text-xs font-extrabold transition shadow bg-white text-amber-700"
          : "py-2 rounded-xl text-xs font-bold transition bg-amber-700/60 text-amber-100";
      });

      // 餐廳標題與狀態
      document.getElementById("restaurantTitle").textContent = `${dayConf.label}｜${menu.name}`;
      const badge = document.getElementById("statusBadge");
      if (dayConf.closed) {
        badge.textContent = "🔒 已結單";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700";
      } else {
        badge.textContent = "🟢 開放點餐中";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700";
      }

      // 分頁按鈕樣式
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      document.getElementById("orderCountBadge").textContent = dayOrders.length;

      document.getElementById("viewBtn-order").className = state.currentView === "order"
        ? "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm"
        : "flex-1 py-2 rounded-lg text-slate-600";
      document.getElementById("viewBtn-summary").className = state.currentView === "summary"
        ? "flex-1 py-2 rounded-lg bg-white text-slate-800 shadow-sm"
        : "flex-1 py-2 rounded-lg text-slate-600";

      document.getElementById("view-order").classList.toggle("hidden", state.currentView !== "order");
      document.getElementById("view-summary").classList.toggle("hidden", state.currentView !== "summary");

      // 結單時隱藏點餐區
      document.getElementById("closedNotice").classList.toggle("hidden", !dayConf.closed);
      document.getElementById("orderFormArea").classList.toggle("hidden", dayConf.closed);
      document.getElementById("bottomBar").classList.toggle("hidden", state.currentView !== "order" || dayConf.closed);

      renderMenuCards(menu);
      renderCartBar(menu);
      renderSummary(dayOrders);
    }

    function renderMenuCards(menu) {
      const container = document.getElementById("menuListContainer");
      container.innerHTML = menu.items.map((item, idx) => {
        const cartItem = state.cart[idx] || { qty: 0, special: "正常" };
        const activeClass = cartItem.qty > 0 ? "border-amber-500 ring-2 ring-amber-200 bg-amber-50/30" : "border-slate-200 bg-white";

        const tagButtons = (menu.tags || ["正常"]).map(tag => {
          const isSelected = cartItem.special === tag;
          return `<button type="button" onclick="selectSpecial(${idx}, '${tag}')" class="px-2.5 py-1 rounded-full text-xs font-bold border ${isSelected ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-100 text-slate-600 border-slate-200'}">${tag}</button>`;
        }).join("");

        return `
          <div class="rounded-2xl p-4 shadow-sm border transition ${activeClass}">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-bold">${item.category || '餐點'}</span>
                <h4 class="text-base font-extrabold text-slate-800 mt-1">${item.name}</h4>
                <p class="text-sm font-bold text-amber-600">$${item.price}</p>
              </div>
              <!-- 3. 餐點份數控制 -->
              <div class="flex items-center gap-3">
                <button type="button" onclick="changeQty(${idx}, -1)" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold text-lg flex items-center justify-center">－</button>
                <span class="w-5 text-center font-extrabold text-base">${cartItem.qty}</span>
                <button type="button" onclick="changeQty(${idx}, 1)" class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold text-lg flex items-center justify-center shadow">＋</button>
              </div>
            </div>

            ${cartItem.qty > 0 ? `
              <div class="mt-3 pt-3 border-t border-slate-200 space-y-2">
                <label class="block text-xs font-bold text-slate-600">4. 餐點特殊需求（點擊快速選擇或自行輸入）</label>
                <div class="flex flex-wrap gap-1.5">${tagButtons}</div>
                <input type="text" value="${cartItem.special}" oninput="updateCustomSpecial(${idx}, this.value)" placeholder="可自行輸入客製需求..." class="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white" />
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    }

    function changeQty(idx, delta) {
      const cur = state.cart[idx] || { qty: 0, special: "正常" };
      const nextQty = Math.max(0, cur.qty + delta);
      if (nextQty === 0) {
        delete state.cart[idx];
      } else {
        state.cart[idx] = { ...cur, qty: nextQty };
      }
      renderAll();
    }

    function selectSpecial(idx, tag) {
      if (!state.cart[idx]) return;
      state.cart[idx].special = tag;
      renderAll();
    }

    function updateCustomSpecial(idx, val) {
      if (!state.cart[idx]) return;
      state.cart[idx].special = val;
    }

    function renderCartBar(menu) {
      let totalQty = 0;
      let totalPrice = 0;
      Object.keys(state.cart).forEach(idx => {
        const item = menu.items[idx];
        const c = state.cart[idx];
        if (item && c.qty > 0) {
          totalQty += c.qty;
          totalPrice += item.price * c.qty;
        }
      });
      document.getElementById("cartTotalQty").textContent = totalQty;
      document.getElementById("cartTotalPrice").textContent = totalPrice;
    }

    async function submitOrder() {
      const userName = document.getElementById("inputUserName").value.trim();
      const note = document.getElementById("inputNote").value.trim();
      const menu = getActiveMenu(state.currentDay);

      if (!userName) {
        alert("請填寫「1. 點餐人姓名 / 暱稱」！");
        return;
      }

      const selectedItems = [];
      Object.keys(state.cart).forEach(idx => {
        const c = state.cart[idx];
        const m = menu.items[idx];
        if (c.qty > 0 && m) {
          selectedItems.push({
            mealName: m.name,
            price: m.price,
            qty: c.qty,
            special: c.special || "正常"
          });
        }
      });

      if (selectedItems.length === 0) {
        alert("請至少選擇一道餐點（點擊 ＋ 增加份數）！");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "送出中...";

      if (isCloudConfigured()) {
        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "addOrders",
              day: state.currentDay,
              userName,
              note,
              items: selectedItems
            })
          });
          const data = await res.json();
          if (data.status !== "ok") {
            alert(data.message || "送出失敗");
            btn.disabled = false;
            btn.textContent = "送出點餐";
            return;
          }
          await loadFromCloud();
        } catch (e) {
          alert("連線異常，請稍後再試");
        }
      } else {
        selectedItems.forEach(item => {
          state.orders.push({
            id: "LOCAL-" + Date.now() + Math.random(),
            day: state.currentDay,
            userName,
            mealName: item.mealName,
            price: item.price,
            qty: item.qty,
            special: item.special,
            note
          });
        });
        saveLocalFallback();
      }

      state.cart = {};
      document.getElementById("inputNote").value = "";
      btn.disabled = false;
      btn.textContent = "送出點餐";
      alert(`🎉 ${userName} 點餐成功！已為您切換至結單總表。`);
      switchView("summary");
    }

    function renderSummary(dayOrders) {
      // 1. 給餐廳叫餐統計
      const dishMap = {};
      dayOrders.forEach(o => {
        const key = `${o.mealName}（${o.special || '正常'}）`;
        dishMap[key] = (dishMap[key] || 0) + Number(o.qty);
      });
      const dishContainer = document.getElementById("dishStatsContainer");
      const dishKeys = Object.keys(dishMap);
      dishContainer.innerHTML = dishKeys.length === 0
        ? `<p class="text-xs text-slate-400">目前尚無點餐紀錄</p>`
        : dishKeys.map(k => `
            <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg">
              <span class="font-medium text-slate-700">${k}</span>
              <span class="font-extrabold text-amber-700">${dishMap[k]} 份</span>
            </div>
          `).join("");

      // 2. 個人應付金額統計
      const personMap = {};
      let grandTotal = 0;
      dayOrders.forEach(o => {
        if (!personMap[o.userName]) personMap[o.userName] = { total: 0, items: [] };
        const sub = Number(o.price) * Number(o.qty);
        personMap[o.userName].total += sub;
        personMap[o.userName].items.push(`${o.mealName}x${o.qty}`);
        grandTotal += sub;
      });
      const personContainer = document.getElementById("personStatsContainer");
      const personKeys = Object.keys(personMap);
      personContainer.innerHTML = personKeys.length === 0
        ? `<p class="text-xs text-slate-400">目前尚無點餐紀錄</p>`
        : personKeys.map(p => `
            <div class="flex justify-between items-center border-b border-slate-100 py-1.5">
              <div>
                <span class="font-bold text-slate-800">${p}</span>
                <span class="text-xs text-slate-400 block">${personMap[p].items.join("、")}</span>
              </div>
              <span class="font-extrabold text-emerald-700">$${personMap[p].total}</span>
            </div>
          `).join("") + `
            <div class="flex justify-between items-center pt-2 font-extrabold text-base text-slate-900">
              <span>全體總金額</span>
              <span class="text-amber-600">$${grandTotal}</span>
            </div>
          `;

      // 3. 5大欄位完整明細表
      const tbody = document.getElementById("detailTableBody");
      tbody.innerHTML = dayOrders.map(o => `
        <tr>
          <td class="py-2 pr-2 font-bold text-slate-800">${o.userName}</td>
          <td class="py-2 pr-2">${o.mealName} <span class="text-slate-400">($${o.price})</span></td>
          <td class="py-2 pr-2 font-bold">${o.qty}</td>
          <td class="py-2 pr-2 text-amber-700">${o.special || '正常'}</td>
          <td class="py-2 text-slate-500">${o.note || '-'}</td>
        </tr>
      `).join("");
    }

    function copyLineSummary() {
      const dayConf = state.config[state.currentDay];
      const menu = getActiveMenu(state.currentDay);
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      if (dayOrders.length === 0) return alert("目前沒有訂單可複製");

      let lines = [`📣 【${dayConf.label}｜${menu.name}】點餐結單明細\n`];
      const personMap = {};
      let grandTotal = 0;

      dayOrders.forEach(o => {
        if (!personMap[o.userName]) personMap[o.userName] = { total: 0, list: [] };
        const sub = Number(o.price) * Number(o.qty);
        personMap[o.userName].total += sub;
        personMap[o.userName].list.push(`${o.mealName} x${o.qty} (${o.special})`);
        grandTotal += sub;
      });

      lines.push("💰 【個人收款明細】");
      Object.keys(personMap).forEach(p => {
        lines.push(`• ${p}：$${personMap[p].total}｜${personMap[p].list.join(" + ")}`);
      });
      lines.push(`\n總計金額：$${grandTotal}`);

      navigator.clipboard.writeText(lines.join("\n"));
      alert("✅ 已複製 LINE 對帳文字！可直接貼到群組收款。");
    }

    function exportCSV() {
      const dayOrders = state.orders.filter(o => o.day === state.currentDay);
      if (dayOrders.length === 0) return alert("目前沒有資料可匯出");
      let csv = "\uFEFF1.點餐人,2.選擇餐點,單價,3.餐點份數,4.餐點特殊需求,5.其他備註\n";
      dayOrders.forEach(o => {
        csv += `"${o.userName}","${o.mealName}",${o.price},${o.qty},"${o.special || ''}","${o.note || ''}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${state.config[state.currentDay].label}_點餐總表.csv`;
      link.click();
    }

    // ==========================================
    // 團主手機管理後台邏輯
    // ==========================================
    function toggleAdminModal() {
      const modal = document.getElementById("adminModal");
      const isHidden = modal.classList.contains("hidden");
      if (isHidden) {
        const dayConf = state.config[state.currentDay];
        document.getElementById("adminCurrentDayTitle").textContent = dayConf.label;
        document.getElementById("adminDayLabel").value = dayConf.label;
        document.getElementById("adminTemplateSelect").value = dayConf.templateKey;
        document.getElementById("adminCustomJson").value = dayConf.customMenu ? JSON.stringify(dayConf.customMenu, null, 2) : "";
        updateAdminCloseBtnUI(dayConf.closed);
      }
      modal.classList.toggle("hidden");
    }

    function onTemplateSelectChange() {
      const val = document.getElementById("adminTemplateSelect").value;
      if (val !== "custom" && RESTAURANT_TEMPLATES[val]) {
        document.getElementById("adminCustomJson").value = JSON.stringify(RESTAURANT_TEMPLATES[val], null, 2);
      }
    }

    function updateAdminCloseBtnUI(closed) {
      const btn = document.getElementById("adminToggleCloseBtn");
      btn.dataset.closed = closed ? "true" : "false";
      if (closed) {
        btn.textContent = "🔒 目前已結單（點擊重新開放）";
        btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white";
      } else {
        btn.textContent = "🟢 目前開放中（點擊一鍵結單）";
        btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white";
      }
    }

    function toggleDayClosed() {
      const btn = document.getElementById("adminToggleCloseBtn");
      const next = btn.dataset.closed !== "true";
      updateAdminCloseBtnUI(next);
    }

    async function saveAdminConfig() {
      const pin = document.getElementById("adminPinInput").value;
      if (pin !== state.config.pin) return alert("團主密碼錯誤！");

      const dayConf = state.config[state.currentDay];
      dayConf.label = document.getElementById("adminDayLabel").value.trim() || dayConf.label;
      dayConf.templateKey = document.getElementById("adminTemplateSelect").value;
      dayConf.closed = document.getElementById("adminToggleCloseBtn").dataset.closed === "true";

      const rawJson = document.getElementById("adminCustomJson").value.trim();
      if (dayConf.templateKey === "custom" && rawJson) {
        try {
          dayConf.customMenu = JSON.parse(rawJson);
        } catch (e) {
          return alert("自訂 JSON 格式有誤，請檢查括號或引號！");
        }
      }

      if (isCloudConfigured()) {
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveConfig", config: state.config })
        });
        await loadFromCloud();
      } else {
        saveLocalFallback();
        renderAll();
      }
      toggleAdminModal();
    }

    async function clearCurrentDayOrders() {
      const pin = document.getElementById("adminPinInput").value;
      if (pin !== state.config.pin) return alert("團主密碼錯誤！");
      if (!confirm(`確定要清空【${state.config[state.currentDay].label}】的所有點餐紀錄嗎？`)) return;

      if (isCloudConfigured()) {
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "clearDayOrders", day: state.currentDay })
        });
        await loadFromCloud();
      } else {
        state.orders = state.orders.filter(o => o.day !== state.currentDay);
        saveLocalFallback();
        renderAll();
      }
      toggleAdminModal();
    }
  </script>
