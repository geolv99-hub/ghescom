<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面連線中...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.5s ease;
            overflow: hidden;
            position: relative;
        }

        /* 正常載入中的動畫 (轉圈圈) */
        .loader {
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* =========================================
           以下為「斷線/失敗狀態」的專屬動畫與樣式 
           ========================================= */
        body.error-state {
            background-color: #1a1a2e; /* 變暗的背景色 */
            color: #e94560; /* 警告的紅色文字 */
        }

        /* 背景：紅色警戒斜線條滾動動畫 */
        .error-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                rgba(233, 69, 96, 0.05),
                rgba(233, 69, 96, 0.05) 30px,
                transparent 30px,
                transparent 60px
            );
            background-size: 85px 85px;
            animation: warningStripes 2s linear infinite;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.error-state .error-bg {
            opacity: 1;
        }
        @keyframes warningStripes {
            0% { background-position: 0 0; }
            100% { background-position: 85px 85px; }
        }

        /* 斷線圖示 (預設隱藏，錯誤時顯示並閃爍) */
        .broken-icon {
            display: none;
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            stroke: #e94560;
            animation: pulseError 1.5s infinite alternate;
        }
        body.error-state .broken-icon {
            display: block;
        }
        body.error-state .loader {
            display: none; /* 隱藏原本的轉圈圈 */
        }
        @keyframes pulseError {
            0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0 0 5px rgba(233, 69, 96, 0.5)); }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.9)); }
        }

        /* 文字樣式 */
        #status {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            z-index: 1;
            letter-spacing: 2px;
        }
        
        #sub-message {
            font-size: 1rem;
            margin-top: 15px;
            color: #888;
            z-index: 1;
            display: none;
        }
        body.error-state #sub-message {
            display: block; /* 錯誤時顯示副標題 */
        }
    </style>
    
    <script>
        // 1. 你的目標網址
        const encodedURL = "aHR0cDovLzEwLjE5Mi4zNi4xMDY6ODA4MC8=";

        async function checkAndRedirect() {
            let decodedURL;
            try {
                decodedURL = atob(encodedURL);
            } catch (error) {
                showError();
                return;
            }

            // 2. 設定連線檢查超時時間 (例如 4 秒)
            // 如果網站掛掉，避免使用者等太久，超過 4 秒就當作沒開放
            const timeoutMs = 4000; 
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                // 3. 在背景悄悄敲一下目標網址測試連線
                // 使用 mode: 'no-cors' 避免跨網域存取擋掉請求，只要伺服器活著有回應就會成功
                await fetch(decodedURL, { 
                    mode: 'no-cors', 
                    cache: 'no-store',
                    signal: controller.signal 
                });
                
                // 取消超時倒數
                clearTimeout(timeoutId);
                
                // 4. 連線成功！立刻執行跳轉
                window.location.replace(decodedURL);
                
            } catch (error) {
                // 如果發生錯誤 (伺服器關閉、連線被拒、或是超過 4 秒沒回應)
                clearTimeout(timeoutId);
                showError();
            }
        }

        // 切換到「斷線/失敗」的畫面狀態
        function showError() {
            document.body.classList.add('error-state');
            document.title = "連線失敗";
            document.getElementById('status').innerText = "網站目前沒有開放！";
        }

        // 當網頁載入完成時，立刻觸發檢查
        window.onload = checkAndRedirect;
    </script>
</head>
<body>
    <div class="error-bg"></div>
    
    <div class="loader"></div>
    
    <svg class="broken-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
    </svg>

    <div id="status">連線中，請稍候...</div>
    <div id="sub-message">系統無法連接至目標伺服器，請稍後再試。</div>
    
    <noscript>
        <p style="z-index: 1;">您的瀏覽器目前停用 JavaScript，無法自動轉址。</p>
    </noscript>
</body>
</html>
